plugins {
    id "com.android.application"
}

def gameUrl = providers.gradleProperty("GAME_URL").getOrElse("https://turbowarp.org/")
def appName = providers.gradleProperty("APP_NAME").getOrElse("Pocket Game")
def minAndroidApi = providers.gradleProperty("MIN_ANDROID_API").getOrElse("23").toInteger()
def escapedGameUrl = gameUrl.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace "com.alphacat731.pocketgame"
    compileSdk 35

    defaultConfig {
        applicationId "com.alphacat731.pocketgame"
        minSdk minAndroidApi
        targetSdk 35
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [appName: appName]
        buildConfigField "String", "START_URL", "\"\${escapedGameUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
