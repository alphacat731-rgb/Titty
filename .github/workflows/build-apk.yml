name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "HTTPS URL on Scratch, TurboWarp, itch.io or itch.zone"
        required: true
        type: string
        default: "https://turbowarp.org/"
      app_name:
        description: "Name shown under the app icon (letters, numbers, spaces, . _ -)"
        required: true
        type: string
        default: "Titty Typers"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate build inputs
        shell: bash
        env:
          GAME_URL_INPUT: ${{ inputs.game_url }}
          APP_NAME_INPUT: ${{ inputs.app_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse

          raw_url = os.environ.get("GAME_URL_INPUT", "").strip()
          app_name = os.environ.get("APP_NAME_INPUT", "").strip()
          parsed = urlparse(raw_url)
          host = (parsed.hostname or "").lower().rstrip(".")
          basic_hosts = {"scratch.mit.edu", "www.scratch.mit.edu", "turbowarp.org", "www.turbowarp.org"}
          is_itch = (
              host == "itch.io" or host.endswith(".itch.io")
              or host == "itch.zone" or host.endswith(".itch.zone")
          )

          if not raw_url or any(c in raw_url for c in "\r\n"):
              raise SystemExit("Invalid URL: provide one HTTPS URL.")
          if parsed.scheme != "https" or not host or not (host in basic_hosts or is_itch):
              raise SystemExit("URL rejected. Use HTTPS on scratch.mit.edu, turbowarp.org, itch.io or itch.zone.")
          if parsed.username or parsed.password or (parsed.port not in (None, 443)):
              raise SystemExit("URL rejected: credentials and custom ports are not allowed.")
          if not re.fullmatch(r"[A-Za-z0-9 _.-]{1,30}", app_name):
              raise SystemExit("App name must be 1-30 characters: letters, numbers, spaces, dots, underscores or hyphens.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GAME_URL={raw_url}\n")
              env.write(f"APP_NAME={app_name}\n")

          print("Inputs valid. Building " + app_name + " for " + host + ".")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PGAME_URL="$GAME_URL" -PAPP_NAME="$APP_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-game-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
